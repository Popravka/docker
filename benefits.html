<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ваши Бенефиты</title>
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <style>
    :root {
      --benefits-accent: #ff6a00;
      --benefits-muted: #7f8a97;
    }

    .benefits-card {
      background: #fff;
      border-radius: 1rem;
      box-shadow: 0 6px 24px rgba(16, 24, 40, 0.08);
      padding: 2rem;
    }

    .benefits-title {
      display: flex;
      align-items: center;
      gap: .75rem;
      margin-bottom: .75rem;
    }

    .benefits-title-dot {
      width: .5rem;
      height: .5rem;
      background: var(--benefits-accent);
      border-radius: 50%;
      flex: 0 0 .5rem;
    }

    .benefits-subtitle { color: var(--benefits-muted); }

    .benefits-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #e8eef7;
      color: #3b5ccc;
      font-weight: 700;
      margin-right: .75rem;
      box-shadow: inset 0 0 0 2px rgba(59, 92, 204, .15);
    }

    .benefits-list .list-group-item {
      border: 0;
      padding: .375rem 0;
      color: #111827;
    }
    .benefits-list .list-group-item .num {
      width: 2.25rem;
      display: inline-block;
      color: var(--benefits-muted);
    }

    .benefits-figure {
      border-radius: .75rem;
      overflow: hidden;
      background: #f3f4f6;
    }
    .benefits-figure img { width: 100%; height: auto; display: block; }

    @media (min-width: 992px) {
      .benefits-card { padding: 2.5rem 2.5rem; }
    }
  </style>
</head>
<body class="bg-light">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-xl-10">
        <div class="benefits-card">
          <div class="row g-4 align-items-center">
            <!-- Left: Text and list -->
            <div class="col-12 col-lg-6">
              <div class="benefits-title">
                <span class="benefits-title-dot"></span>
                <h2 class="h3 m-0">Teambuilding</h2>
              </div>
              <p class="benefits-subtitle mb-4">Dedicated budget and time to bond as a team, wherever you are.</p>

              <div class="benefits-list">
                <ul class="list-group list-group-flush">
                  <li class="list-group-item d-flex align-items-center">
                    <span class="benefits-avatar">D</span>
                    <span>Medical Insurance</span>
                  </li>
                  <li class="list-group-item"><span class="num">03</span> <span>Workstation</span></li>
                  <li class="list-group-item"><span class="num">04</span> <span>Paid Time Off</span></li>
                  <li class="list-group-item"><span class="num">05</span> <span>Certifications</span></li>
                  <li class="list-group-item"><span class="num">06</span> <span>Referral Program</span></li>
                  <li class="list-group-item"><span class="num">07</span> <span>Occasional Gifts</span></li>
                  <li class="list-group-item"><span class="num">08</span> <span>Loyalty Program</span></li>
                </ul>
              </div>
            </div>

            <!-- Right: Image -->
            <div class="col-12 col-lg-6">
              <figure class="benefits-figure m-0 ratio ratio-4x3">
                <img src="https://images.unsplash.com/photo-1560250097-0b93528c311a?q=80&w=1740&auto=format&fit=crop" alt="Team taking a selfie" class="object-fit-cover" />
              </figure>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
